services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - core_node_modules:/app/packages/core/node_modules
      - db_node_modules:/app/packages/db/node_modules
      - ui_node_modules:/app/packages/ui/node_modules
      - web_next:/app/apps/web/.next
    restart: unless-stopped
    networks:
      - app-net
      - sandbox-net

networks:
  app-net:
    driver: bridge
  sandbox-net:
    name: sandbox-net
    driver: bridge

volumes:
  node_modules:
  web_node_modules:
  core_node_modules:
  db_node_modules:
  ui_node_modules:
  web_next: