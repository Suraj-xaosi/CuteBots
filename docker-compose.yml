services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - core_node_modules:/app/packages/core/node_modules
      - db_node_modules:/app/packages/db/node_modules
      - ui_node_modules:/app/packages/ui/node_modules
      - web_next:/app/apps/web/.next
    restart: unless-stopped
    environment:
      AGENT_API_URL: http://agent:3001
    depends_on:
      - agent
    networks:
      - app-net

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - agent_node_modules:/app/apps/agent/node_modules
      - core_node_modules:/app/packages/core/node_modules
      - db_node_modules:/app/packages/db/node_modules
      - ui_node_modules:/app/packages/ui/node_modules
      - core_dist:/app/packages/core/dist
      - types_dist:/app/packages/types/dist
      - db_dist:/app/packages/db/dist
      - db_generated:/app/packages/db/src/generated/prisma
      - agent_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["npm", "run", "dev", "--workspace=agent"]
    environment:
      PORT: 3001
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-cutebots-sandbox-node:latest}
      SANDBOX_NETWORK: sandbox-net
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      MEM0_HISTORY_DB_PATH: /app/data/mem0-history.db
      DATABASE_URL: file:/app/data/database.db
    restart: unless-stopped
    depends_on:
      - qdrant
    networks:
      - app-net

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
  sandbox-net:
    name: sandbox-net
    driver: bridge

volumes:
  agent_data:
  qdrant_data:
  node_modules:
  agent_node_modules:
  web_node_modules:
  core_node_modules:
  db_node_modules:
  ui_node_modules:
  core_dist:
  types_dist:
  db_dist:
  web_next:
  db_generated: